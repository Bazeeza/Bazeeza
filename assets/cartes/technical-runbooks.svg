<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="Carte du projet Technical Runbooks : 15 procédures TI en anglais sur un gabarit unique, version 1.0.0, du démarrage UEFI au câblage, à la VoIP et à Active Directory.">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="1" stop-color="#0c1830"/>
    </linearGradient>
    <pattern id="grille" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#5b7bb5" fill-opacity=".14"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .puce { fill: #0f1d3a; stroke: #1d3157; }
      .chiffre { fill: #3fe0a0; font-weight: 700; }
      .unite { fill: #9fb0d0; }
    </style>
  </defs>

  <rect x="1" y="1" width="558" height="248" rx="14" fill="url(#fond)" stroke="#1d3157" stroke-width="1.5"/>
  <rect x="1" y="1" width="558" height="248" rx="14" fill="url(#grille)"/>
  <rect x="1" y="1" width="6" height="248" rx="3" fill="#3fe0a0"/>

  <text x="32" y="40" class="m" font-size="13" fill="#3fe0a0">$ ls runbooks/  01 … 15</text>
  <text x="32" y="76" class="t" font-size="27" font-weight="700" fill="#ffffff">Technical Runbooks</text>
  <text x="32" y="108" class="t" font-size="15" fill="#b8c6e3">Des procédures TI pas à pas, écrites pour être</text>
  <text x="32" y="130" class="t" font-size="15" fill="#b8c6e3">suivies sous pression, avec vérification à la fin.</text>

  <g class="m" font-size="14">
    <rect x="32" y="152" width="160" height="34" rx="8" class="puce"/>
    <text x="46" y="174"><tspan class="chiffre">15</tspan><tspan class="unite"> procédures</tspan></text>
    <rect x="204" y="152" width="150" height="34" rx="8" class="puce"/>
    <text x="218" y="174"><tspan class="chiffre">v1.0.0</tspan><tspan class="unite"> publiée</tspan></text>
    <rect x="366" y="152" width="162" height="34" rx="8" class="puce"/>
    <text x="380" y="174"><tspan class="chiffre">1</tspan><tspan class="unite"> seul gabarit</tspan></text>
  </g>

  <text x="32" y="222" class="m" font-size="13" fill="#6b7fa6">Windows · Active Directory · Cisco IOS · VoIP · Linux</text>
</svg>
