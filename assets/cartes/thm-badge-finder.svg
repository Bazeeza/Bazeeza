<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="Carte du projet TryHackMe Badge Finder : 138 badges reliés à la salle qui les donne, 28 tests d'attaque dans la CI, site en ligne sur GitHub Pages.">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="1" stop-color="#0c1830"/>
    </linearGradient>
    <pattern id="grille" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#5b7bb5" fill-opacity=".14"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .puce { fill: #0f1d3a; stroke: #1d3157; }
      .chiffre { fill: #ffb454; font-weight: 700; }
      .unite { fill: #9fb0d0; }
    </style>
  </defs>

  <rect x="1" y="1" width="558" height="248" rx="14" fill="url(#fond)" stroke="#1d3157" stroke-width="1.5"/>
  <rect x="1" y="1" width="558" height="248" rx="14" fill="url(#grille)"/>
  <rect x="1" y="1" width="6" height="248" rx="3" fill="#ffb454"/>

  <text x="32" y="40" class="m" font-size="13" fill="#ffb454">~/thm-badge-finder</text>
  <text x="32" y="76" class="t" font-size="27" font-weight="700" fill="#ffffff">TryHackMe Badge Finder</text>
  <text x="32" y="108" class="t" font-size="15" fill="#b8c6e3">Chaque badge TryHackMe relié à la salle,</text>
  <text x="32" y="130" class="t" font-size="15" fill="#b8c6e3">au module ou au parcours qui le débloque.</text>

  <g class="m" font-size="14">
    <rect x="32" y="152" width="140" height="34" rx="8" class="puce"/>
    <text x="46" y="174"><tspan class="chiffre">138</tspan><tspan class="unite"> badges</tspan></text>
    <rect x="184" y="152" width="190" height="34" rx="8" class="puce"/>
    <text x="198" y="174"><tspan class="chiffre">28</tspan><tspan class="unite"> tests d'attaque</tspan></text>
    <rect x="386" y="152" width="142" height="34" rx="8" class="puce"/>
    <text x="400" y="174"><tspan class="chiffre">site</tspan><tspan class="unite"> en ligne</tspan></text>
  </g>

  <text x="32" y="222" class="m" font-size="13" fill="#6b7fa6">HTML · JavaScript · Python · GitHub Actions</text>
</svg>
