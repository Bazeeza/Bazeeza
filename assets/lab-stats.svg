<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Le lab en chiffres : 2 nœuds sur 2 continents ; 9 sondes Uptime Kuma ; plus de 284 000 bannissements fail2ban et 0 intrusion ; 0 port d'administration public">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .tuile { fill: #081122; stroke: #1d3157; stroke-width: 1.5; }
      .cmd { font-size: 13px; fill: #5f7299; }
      .n { font-size: 40px; font-weight: 700; }
      .l { font-size: 15px; fill: #b8c6e3; }
      .pouls { animation: pouls 2s ease-in-out infinite; }
      @keyframes pouls { 50% { opacity: .25; } }
    </style>
  </defs>
  <g>
    <rect x="4" y="4" width="282" height="142" rx="12" class="tuile"/>
    <circle cx="262" cy="26" r="5" fill="#3fe0a0" class="pouls"/>
    <text x="24" y="32" class="m cmd"># tailscale</text>
    <text x="24" y="86" class="t n" fill="#3fe0a0">2 nœuds</text>
    <text x="24" y="118" class="t l">Canada + Finlande, en maillage</text>
  </g>
  <g>
    <rect x="306" y="4" width="282" height="142" rx="12" class="tuile"/>
    <circle cx="564" cy="26" r="5" fill="#2b9dff" class="pouls"/>
    <text x="326" y="32" class="m cmd"># uptime kuma</text>
    <text x="326" y="86" class="t n" fill="#2b9dff">9 sondes</text>
    <text x="326" y="118" class="t l">alertes envoyées sur Telegram</text>
  </g>
  <g>
    <rect x="608" y="4" width="282" height="142" rx="12" class="tuile"/>
    <circle cx="866" cy="26" r="5" fill="#ffb454" class="pouls"/>
    <text x="628" y="32" class="m cmd"># fail2ban</text>
    <text x="628" y="86" class="t n" fill="#ffb454">284 000+</text>
    <text x="628" y="118" class="t l">tentatives bloquées · 0 intrusion</text>
  </g>
  <g>
    <rect x="910" y="4" width="286" height="142" rx="12" class="tuile"/>
    <circle cx="1172" cy="26" r="5" fill="#c792ea" class="pouls"/>
    <text x="930" y="32" class="m cmd"># ss -tlnp</text>
    <text x="930" y="86" class="t n" fill="#c792ea">0 port</text>
    <text x="930" y="118" class="t l">d'administration exposé au public</text>
  </g>
</svg>
