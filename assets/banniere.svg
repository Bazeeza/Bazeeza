<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bariu Azeez — Technicien réseau et télécommunication">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="1" stop-color="#0d1a33"/>
    </linearGradient>
    <linearGradient id="nom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fe8ff"/>
    </linearGradient>
    <pattern id="grille" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5b7bb5" stroke-opacity=".09"/>
    </pattern>
    <radialGradient id="halo" cx=".78" cy=".5" r=".45">
      <stop offset="0" stop-color="#2b9dff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2b9dff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .lien { stroke: #3a5a8f; stroke-width: 2; fill: none; }
      .secours { stroke: #ffb454; stroke-width: 2; stroke-dasharray: 6 6; fill: none; opacity: .7; }
      .noeud { fill: #0f1d3a; stroke-width: 2.5; }
      .etiq { font-size: 12px; fill: #9fb0d0; letter-spacing: .5px; }
      .curseur { animation: clignote 1.1s steps(1) infinite; }
      .onde { stroke-dasharray: 14 10; animation: defile 1.6s linear infinite; }
      @keyframes clignote { 50% { opacity: 0; } }
      @keyframes defile { to { stroke-dashoffset: -48; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#fond)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grille)"/>
  <rect width="1200" height="320" rx="18" fill="url(#halo)"/>

  <!-- Texte -->
  <text x="60" y="86" class="m" font-size="15" fill="#3fe0a0">// technicien réseau &amp; télécommunication</text>
  <text x="56" y="158" class="t" font-size="66" font-weight="700" fill="url(#nom)">Bariu Azeez</text>
  <text x="60" y="200" class="t" font-size="21" fill="#b8c6e3">Réseaux Cisco · Téléphonie IP · Supervision · Infrastructure</text>
  <text x="60" y="252" class="m" font-size="16" fill="#9fb0d0"><tspan fill="#3fe0a0">$</tspan> ping recruteur <tspan fill="#5b7bb5">→</tspan> <tspan fill="#ffffff">disponible, Montréal QC</tspan></text>
  <rect x="440" y="238" width="10" height="18" fill="#3fe0a0" class="curseur"/>

  <!-- Topologie : liens -->
  <path id="l1" class="lien" d="M820 92 L955 168"/>
  <path id="l2" class="lien" d="M1085 96 L955 168"/>
  <path id="l3" class="lien" d="M955 168 L835 248"/>
  <path id="l4" class="lien" d="M955 168 L1095 246"/>
  <path id="l5" class="secours" d="M820 92 L1085 96"/>

  <!-- Paquets -->
  <circle r="4.5" fill="#3fe0a0"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
  <circle r="4.5" fill="#2b9dff"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l2"/></animateMotion></circle>
  <circle r="4.5" fill="#3fe0a0"><animateMotion dur="1.9s" begin=".3s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
  <circle r="4.5" fill="#2b9dff"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l4"/></animateMotion></circle>
  <circle r="4" fill="#ffb454"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>

  <!-- Noeuds -->
  <g>
    <circle cx="955" cy="168" r="18" fill="none" stroke="#3fe0a0" stroke-width="2">
      <animate attributeName="r" values="18;38" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="955" cy="168" r="18" class="noeud" stroke="#3fe0a0"/>
    <text x="955" y="205" text-anchor="middle" class="m etiq">CORE</text>

    <circle cx="820" cy="92" r="14" class="noeud" stroke="#2b9dff"/>
    <text x="820" y="66" text-anchor="middle" class="m etiq">RTR-A</text>
    <circle cx="1085" cy="96" r="14" class="noeud" stroke="#2b9dff"/>
    <text x="1085" y="70" text-anchor="middle" class="m etiq">RTR-B</text>
    <circle cx="835" cy="248" r="13" class="noeud" stroke="#ffb454"/>
    <text x="835" y="284" text-anchor="middle" class="m etiq">VoIP / SIP</text>
    <circle cx="1095" cy="246" r="13" class="noeud" stroke="#ffb454"/>
    <text x="1095" y="282" text-anchor="middle" class="m etiq">SNMP</text>
    <text x="952" y="86" text-anchor="middle" class="m" font-size="11" fill="#ffb454" opacity=".85">route flottante · AD 5</text>
  </g>

  <!-- Onde de signal -->
  <path class="onde" d="M0 306 Q 25 296 50 306 T 100 306 T 150 306 T 200 306 T 250 306 T 300 306 T 350 306 T 400 306 T 450 306 T 500 306 T 550 306 T 600 306 T 650 306 T 700 306 T 750 306 T 800 306 T 850 306 T 900 306 T 950 306 T 1000 306 T 1050 306 T 1100 306 T 1150 306 T 1200 306" fill="none" stroke="#2b9dff" stroke-opacity=".45" stroke-width="2"/>
</svg>
