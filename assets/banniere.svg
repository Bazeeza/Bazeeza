<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Terminal : whoami répond bazeeza ; ses intérêts : réseaux, téléphonie IP, supervision et homelab. À droite, une petite topologie réseau animée.">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b17"/>
      <stop offset="1" stop-color="#0c1830"/>
    </linearGradient>
    <linearGradient id="nom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8be9ff"/>
    </linearGradient>
    <pattern id="grille" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#5b7bb5" fill-opacity=".18"/>
    </pattern>
    <radialGradient id="halo" cx=".8" cy=".5" r=".4">
      <stop offset="0" stop-color="#2b9dff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2b9dff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .p { fill: #3fe0a0; }
      .c { fill: #ffffff; }
      .o { fill: #9fb0d0; }
      .ligne { animation: apparait .35s ease-out both; }
      .l1 { animation-delay: .2s; } .l2 { animation-delay: .9s; } .l3 { animation-delay: 1.5s; }
      .l4 { animation-delay: 2.2s; } .l5 { animation-delay: 2.8s; }
      .curseur { animation: clignote 1.1s steps(1) infinite; }
      .lien { stroke: #2c4778; stroke-width: 2; fill: none; }
      .secours { stroke: #ffb454; stroke-width: 2; stroke-dasharray: 6 6; fill: none; opacity: .65; }
      .noeud { fill: #0f1d3a; stroke-width: 2.5; }
      .etiq { font-size: 12px; fill: #8fa3c8; letter-spacing: .5px; }
      @keyframes apparait { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      @keyframes clignote { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="330" rx="18" fill="url(#fond)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grille)"/>
  <rect width="1200" height="330" rx="18" fill="url(#halo)"/>

  <!-- Fenêtre de terminal -->
  <rect x="36" y="32" width="660" height="266" rx="12" fill="#081122" stroke="#1d3157" stroke-width="1.5"/>
  <path d="M36 44a12 12 0 0 1 12-12h636a12 12 0 0 1 12 12v18H36z" fill="#0e1b35"/>
  <circle cx="58" cy="47" r="6" fill="#ff6b6b"/>
  <circle cx="80" cy="47" r="6" fill="#ffb454"/>
  <circle cx="102" cy="47" r="6" fill="#3fe0a0"/>
  <text x="366" y="52" text-anchor="middle" class="m" font-size="13" fill="#5f7299">bazeeza@lab: ~</text>

  <g class="m" font-size="17">
    <text x="60" y="100" class="ligne l1"><tspan class="p">bazeeza@lab</tspan><tspan class="o">:~$ </tspan><tspan class="c">whoami</tspan></text>
    <text x="60" y="152" class="t ligne l2" font-size="50" font-weight="700" fill="url(#nom)">bazeeza</text>
    <text x="60" y="196" class="ligne l3"><tspan class="p">bazeeza@lab</tspan><tspan class="o">:~$ </tspan><tspan class="c">cat interets.txt</tspan></text>
    <text x="60" y="226" class="ligne l4" fill="#b8c6e3">réseaux · téléphonie IP · supervision · homelab</text>
    <text x="60" y="270" class="ligne l5"><tspan class="p">bazeeza@lab</tspan><tspan class="o">:~$ </tspan></text>
  </g>
  <rect x="222" y="256" width="10" height="18" fill="#3fe0a0" class="curseur"/>

  <!-- Topologie animée -->
  <path id="l1" class="lien" d="M842 96 L975 172"/>
  <path id="l2" class="lien" d="M1105 100 L975 172"/>
  <path id="l3" class="lien" d="M975 172 L855 252"/>
  <path id="l4" class="lien" d="M975 172 L1115 250"/>
  <path id="l5" class="secours" d="M842 96 L1105 100"/>

  <circle r="4.5" fill="#3fe0a0"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
  <circle r="4.5" fill="#2b9dff"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l2"/></animateMotion></circle>
  <circle r="4.5" fill="#3fe0a0"><animateMotion dur="1.9s" begin=".3s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
  <circle r="4.5" fill="#2b9dff"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l4"/></animateMotion></circle>
  <circle r="4" fill="#ffb454"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>

  <circle cx="975" cy="172" r="18" fill="none" stroke="#3fe0a0" stroke-width="2">
    <animate attributeName="r" values="18;40" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="975" cy="172" r="18" class="noeud" stroke="#3fe0a0"/>
  <text x="975" y="210" text-anchor="middle" class="m etiq">CORE</text>
  <circle cx="842" cy="96" r="14" class="noeud" stroke="#2b9dff"/>
  <text x="842" y="70" text-anchor="middle" class="m etiq">RTR-A</text>
  <circle cx="1105" cy="100" r="14" class="noeud" stroke="#2b9dff"/>
  <text x="1105" y="74" text-anchor="middle" class="m etiq">RTR-B</text>
  <circle cx="855" cy="252" r="13" class="noeud" stroke="#ffb454"/>
  <text x="855" y="288" text-anchor="middle" class="m etiq">VoIP / SIP</text>
  <circle cx="1115" cy="250" r="13" class="noeud" stroke="#c792ea"/>
  <text x="1115" y="286" text-anchor="middle" class="m etiq">SNMP</text>
  <text x="973" y="90" text-anchor="middle" class="m" font-size="11" fill="#ffb454" opacity=".85">lien de secours</text>
</svg>
